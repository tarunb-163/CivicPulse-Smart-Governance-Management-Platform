name: CivicPulse CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: civicplus
          MYSQL_ROOT_PASSWORD: Root@2806.
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run Automated Tests
        run: mvn clean verify -B

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

  docker-smoke-test:
    name: Docker Compose Build & Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start Docker Compose Services
        run: |
          docker compose up --build -d
          # Wait for app healthcheck
          echo "Waiting for CivicPulse to become healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
              echo "App is healthy!"
              break
            fi
            sleep 2
          done

      - name: Execute Lifecycle Smoke Test
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh http://localhost:8080

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
