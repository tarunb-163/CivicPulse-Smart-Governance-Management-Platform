<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Work Queue — CivicPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <div class="cp-aurora-bg">
    <div class="cp-blob cp-blob-1"></div>
    <div class="cp-blob cp-blob-2"></div>
  </div>

  <div class="cp-app-layout">
    <aside class="cp-sidebar" id="cpSidebar">
      <div class="cp-sidebar-header">
        <a href="/officer/dashboard.html" class="cp-nav-brand">
          <div class="cp-brand-logo"><i class="bi bi-shield-check"></i></div>
          <span class="cp-sidebar-text">Civic<span class="cp-gradient-text">Pulse</span></span>
        </a>
      </div>
      <ul class="cp-sidebar-menu">
        <li class="cp-sidebar-item"><a href="/officer/dashboard.html" class="cp-sidebar-link"><i class="bi bi-speedometer2"></i><span class="cp-sidebar-text">Dashboard</span></a></li>
        <li class="cp-sidebar-item"><a href="/officer/queue.html" class="cp-sidebar-link active"><i class="bi bi-inbox-fill"></i><span class="cp-sidebar-text">Work Queue</span></a></li>
        <li class="cp-sidebar-item"><a href="/officer/board.html" class="cp-sidebar-link"><i class="bi bi-kanban-fill"></i><span class="cp-sidebar-text">Kanban Board</span></a></li>
      </ul>
      <div class="p-3 border-top">
        <button id="logoutBtn" class="cp-btn cp-btn-ghost w-100 justify-content-start text-danger">
          <i class="bi bi-box-arrow-right me-2"></i><span class="cp-sidebar-text">Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="cp-main-content">
      <header class="cp-topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm cp-btn-ghost d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
          <h5 class="fw-bold mb-0">Department Grievance Queue</h5>
        </div>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm cp-btn-ghost cp-open-palette" title="Search (Ctrl+K)"><i class="bi bi-search"></i></button>
          <button class="btn btn-sm cp-btn-ghost cp-theme-toggle" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
        </div>
      </header>

      <div class="cp-page-container">
        <!-- Filter Controls -->
        <div class="cp-card p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-5">
              <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search by title, description or code...">
            </div>
            <div class="col-md-3">
              <select id="statusFilter" class="form-select form-select-sm">
                <option value="">All Statuses</option>
                <option value="SUBMITTED">SUBMITTED</option>
                <option value="ASSIGNED">ASSIGNED</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="RESOLVED">RESOLVED</option>
                <option value="REOPENED">REOPENED</option>
                <option value="ESCALATED">ESCALATED</option>
                <option value="CLOSED">CLOSED</option>
              </select>
            </div>
            <div class="col-md-4 text-md-end">
              <a href="/officer/board.html" class="btn btn-sm btn-outline-primary rounded-pill">
                <i class="bi bi-kanban me-1"></i>Switch to Kanban View
              </a>
            </div>
          </div>
        </div>

        <!-- Queue Table -->
        <div class="cp-card p-4">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Code</th>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>SLA</th>
                  <th>Date</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody id="queueTbody">
                <tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading departmental queue...</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <button class="btn btn-sm cp-btn-secondary rounded-pill" id="prevBtn" disabled>&larr; Previous</button>
            <span class="small text-muted" id="pageLabel">Page 1</span>
            <button class="btn btn-sm cp-btn-secondary rounded-pill" id="nextBtn" disabled>Next &rarr;</button>
          </div>
        </div>
      </div>

      <footer class="cp-footer-slim">
        <div>&copy; 2026 CivicPulse Municipal Redressal.</div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { checkRouteGuard } from '/assets/js/core/router-guard.js';
    import { logout } from '/assets/js/core/auth.js';
    import { apiRequest } from '/assets/js/core/api.js';
    import { escapeHtml, formatDate, getStatusChip, renderSlaRing, renderPriorityBadge } from '/assets/js/core/utils.js';
    import { openOfficerWorkspaceDrawer } from '/assets/js/modules/officer.js';
    import '/assets/js/core/theme.js';
    import '/assets/js/ui/palette.js';
    import '/assets/js/ui/bot.js';

    checkRouteGuard(['OFFICER', 'DEPT_HEAD', 'ADMIN']);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('cpSidebar').classList.toggle('show');
    });

    let page = 0;
    const tbody = document.getElementById('queueTbody');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageLabel = document.getElementById('pageLabel');
    const statusFilter = document.getElementById('statusFilter');
    const searchInput = document.getElementById('searchInput');

    let currentItems = [];

    async function loadQueue() {
      tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading departmental queue...</td></tr>`;
      try {
        let url = `/officer/complaints?page=${page}&size=10&sort=priorityScore,desc`;
        if (statusFilter.value) url += `&status=${statusFilter.value}`;

        const res = await apiRequest(url);
        currentItems = res.content || [];

        if (searchInput.value.trim()) {
          const q = searchInput.value.toLowerCase().trim();
          currentItems = currentItems.filter(c => (c.title || '').toLowerCase().includes(q) || (c.code || '').toLowerCase().includes(q));
        }

        if (currentItems.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No complaints found.</td></tr>`;
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          return;
        }

        tbody.innerHTML = currentItems.map(c => `
          <tr>
            <td><span class="cp-mono fw-bold text-primary">${escapeHtml(c.code)}</span></td>
            <td>
              <div class="fw-semibold">${escapeHtml(c.title)}</div>
              <small class="text-muted">${escapeHtml(c.address || '')}</small>
            </td>
            <td><span class="badge bg-secondary-subtle text-secondary">${escapeHtml(c.categoryName || 'General')}</span></td>
            <td>${renderPriorityBadge(c.priorityScore)}</td>
            <td>${getStatusChip(c.status)}</td>
            <td>${renderSlaRing(c.slaDueAt, c.status)}</td>
            <td class="small text-muted">${formatDate(c.createdAt)}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-primary rounded-pill cp-open-drawer-btn" data-id="${c.id}">
                Open Drawer &rarr;
              </button>
            </td>
          </tr>
        `).join('');

        tbody.querySelectorAll('.cp-open-drawer-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = parseInt(btn.getAttribute('data-id'));
            const comp = currentItems.find(x => x.id === id);
            if (comp) {
              openOfficerWorkspaceDrawer(comp, () => loadQueue());
            }
          });
        });

        const totalPages = res.totalPages || 1;
        pageLabel.textContent = `Page ${page + 1} of ${totalPages}`;
        prevBtn.disabled = page === 0;
        nextBtn.disabled = page >= totalPages - 1;

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">Failed to load queue.</td></tr>`;
      }
    }

    statusFilter.addEventListener('change', () => { page = 0; loadQueue(); });
    searchInput.addEventListener('input', () => loadQueue());
    prevBtn.addEventListener('click', () => { if (page > 0) { page--; loadQueue(); } });
    nextBtn.addEventListener('click', () => { page++; loadQueue(); });

    loadQueue();
  </script>
</body>
</html>
