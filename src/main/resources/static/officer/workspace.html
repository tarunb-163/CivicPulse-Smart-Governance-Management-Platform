<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Grievance Workspace — CivicPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <div class="cp-aurora-bg">
    <div class="cp-blob cp-blob-1"></div>
    <div class="cp-blob cp-blob-2"></div>
  </div>

  <div class="cp-app-layout">
    <aside class="cp-sidebar" id="cpSidebar">
      <div class="cp-sidebar-header">
        <a href="/officer/dashboard.html" class="cp-nav-brand">
          <div class="cp-brand-logo"><i class="bi bi-shield-check"></i></div>
          <span class="cp-sidebar-text">Civic<span class="cp-gradient-text">Pulse</span></span>
        </a>
      </div>
      <ul class="cp-sidebar-menu">
        <li class="cp-sidebar-item"><a href="/officer/dashboard.html" class="cp-sidebar-link"><i class="bi bi-speedometer2"></i><span class="cp-sidebar-text">Dashboard</span></a></li>
        <li class="cp-sidebar-item"><a href="/officer/queue.html" class="cp-sidebar-link"><i class="bi bi-inbox-fill"></i><span class="cp-sidebar-text">Work Queue</span></a></li>
        <li class="cp-sidebar-item"><a href="/officer/board.html" class="cp-sidebar-link"><i class="bi bi-kanban-fill"></i><span class="cp-sidebar-text">Kanban Board</span></a></li>
      </ul>
      <div class="p-3 border-top">
        <button id="logoutBtn" class="cp-btn cp-btn-ghost w-100 justify-content-start text-danger">
          <i class="bi bi-box-arrow-right me-2"></i><span class="cp-sidebar-text">Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="cp-main-content">
      <header class="cp-topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm cp-btn-ghost d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
          <a href="/officer/queue.html" class="btn btn-sm cp-btn-ghost me-2">&larr; Queue</a>
          <h5 class="fw-bold mb-0">Officer Incident Workspace</h5>
        </div>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm cp-btn-ghost cp-open-palette" title="Search (Ctrl+K)"><i class="bi bi-search"></i></button>
          <button class="btn btn-sm cp-btn-ghost cp-theme-toggle" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
        </div>
      </header>

      <div class="cp-page-container">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="cp-card p-4 mb-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="cp-mono fw-bold fs-4 text-primary" id="workCode">Loading...</span>
                <div id="workStatusChip"></div>
              </div>
              <h4 class="fw-bold mb-2" id="workTitle"></h4>
              <p class="text-muted" id="workDesc"></p>

              <div class="p-3 bg-light rounded-3 my-3">
                <div class="small text-muted">Location</div>
                <strong id="workAddress" class="small"></strong>
              </div>

              <!-- Internal Comments -->
              <h6 class="fw-bold mt-4 mb-3"><i class="bi bi-chat-left-dots text-primary me-2"></i>Departmental Activity & Notes</h6>
              <div id="workComments" class="d-flex flex-column gap-2 mb-3" style="max-height: 250px; overflow-y: auto;"></div>

              <form id="workNoteForm" class="d-flex gap-2">
                <input type="text" id="workNoteInput" class="form-control form-control-sm rounded-pill" placeholder="Add internal departmental note..." required>
                <button type="submit" class="btn btn-sm cp-btn-secondary rounded-pill px-3">Add Note</button>
              </form>
            </div>
          </div>

          <div class="col-lg-4">
            <!-- Action Form -->
            <div class="cp-card p-4 mb-4">
              <h6 class="fw-bold mb-3"><i class="bi bi-lightning-charge-fill text-warning me-2"></i>Redressal Actions</h6>
              <form id="workActionForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Next Transition</label>
                  <select id="actionStatusSelect" class="form-select form-select-sm" required>
                    <option value="">Select transition...</option>
                    <option value="IN_PROGRESS">IN_PROGRESS (Begin Work)</option>
                    <option value="RESOLVED">RESOLVED (Completed with Proof)</option>
                    <option value="REJECTED">REJECTED (Invalid / Out of Scope)</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold">Resolution Remark *</label>
                  <textarea id="actionRemark" class="form-control form-control-sm" rows="3" placeholder="Provide municipal details..." required></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold">Photo Proof (Required for Resolved)</label>
                  <input type="file" id="actionProof" class="form-control form-control-sm" accept="image/*">
                </div>

                <button type="submit" class="btn cp-btn-primary btn-sm w-100 rounded-pill mb-3">Execute Status Change</button>
              </form>

              <hr>

              <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" id="btnWorkMerge">
                  <i class="bi bi-intersect me-1"></i>Merge Duplicate
                </button>
                <button type="button" class="btn btn-outline-danger btn-sm rounded-pill" id="btnWorkReject">
                  <i class="bi bi-x-circle me-1"></i>Reject Complaint
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="cp-footer-slim">
        <div>&copy; 2026 CivicPulse Municipal Redressal.</div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { checkRouteGuard } from '/assets/js/core/router-guard.js';
    import { logout } from '/assets/js/core/auth.js';
    import { apiRequest } from '/assets/js/core/api.js';
    import { showToast } from '/assets/js/core/toast.js';
    import { escapeHtml, formatDate, getStatusChip } from '/assets/js/core/utils.js';
    import { updateStatus, rejectComplaint, mergeComplaint } from '/assets/js/modules/officer.js';
    import { addComment } from '/assets/js/modules/complaints.js';
    import '/assets/js/core/theme.js';
    import '/assets/js/ui/palette.js';
    import '/assets/js/ui/bot.js';

    checkRouteGuard(['OFFICER', 'DEPT_HEAD', 'ADMIN']);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('cpSidebar').classList.toggle('show');
    });

    const params = new URLSearchParams(window.location.search);
    const complaintId = params.get('id');
    if (!complaintId) window.location.href = '/officer/queue.html';

    let comp = null;

    async function loadWorkspace() {
      try {
        comp = await apiRequest(`/complaints/${complaintId}`);
        document.getElementById('workCode').textContent = comp.code;
        document.getElementById('workTitle').textContent = comp.title;
        document.getElementById('workDesc').textContent = comp.description;
        document.getElementById('workAddress').textContent = comp.address || 'Coordinates marked';
        document.getElementById('workStatusChip').innerHTML = getStatusChip(comp.status);

        const commentsCont = document.getElementById('workComments');
        const list = comp.comments || [];
        if (list.length === 0) {
          commentsCont.innerHTML = `<div class="text-muted small py-2">No notes logged.</div>`;
        } else {
          commentsCont.innerHTML = list.map(m => `
            <div class="p-2 rounded-2 ${m.isInternal ? 'bg-warning-subtle' : 'bg-light'} small">
              <div class="d-flex justify-content-between text-muted" style="font-size: 0.7rem;">
                <strong>${escapeHtml(m.authorName || 'Officer')}</strong>
                <span>${formatDate(m.createdAt)}</span>
              </div>
              <div>${escapeHtml(m.comment)}</div>
            </div>
          `).join('');
        }
      } catch (err) {
        showToast('Failed to load workspace', 'error');
      }
    }

    document.getElementById('workActionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('actionStatusSelect').value;
      const remark = document.getElementById('actionRemark').value.trim();
      const proof = document.getElementById('actionProof').files[0];

      try {
        await updateStatus(complaintId, status, remark, proof);
        showToast('Status successfully transitioned', 'success');
        loadWorkspace();
      } catch {}
    });

    document.getElementById('workNoteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const txt = document.getElementById('workNoteInput').value.trim();
      if (!txt) return;
      try {
        await addComment(complaintId, txt, true);
        document.getElementById('workNoteInput').value = '';
        showToast('Internal note saved', 'success');
        loadWorkspace();
      } catch {}
    });

    document.getElementById('btnWorkMerge').addEventListener('click', async () => {
      const parentCode = prompt('Enter Parent Complaint Code:');
      if (!parentCode) return;
      const reason = prompt('Reason for merging:') || 'Duplicate grievance merged';
      try {
        const parent = await apiRequest(`/public/complaints/code/${encodeURIComponent(parentCode.trim())}`);
        await mergeComplaint(complaintId, parent.id, reason);
        showToast('Grievance merged', 'success');
        loadWorkspace();
      } catch (err) {
        showToast(err.message || 'Merge failed', 'error');
      }
    });

    document.getElementById('btnWorkReject').addEventListener('click', async () => {
      const reason = prompt('Specify rejection reason:');
      if (!reason) return;
      try {
        await rejectComplaint(complaintId, reason);
        showToast('Grievance rejected', 'success');
        loadWorkspace();
      } catch {}
    });

    loadWorkspace();
  </script>
</body>
</html>
