<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CivicPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">
  <div class="cp-aurora-bg">
    <div class="cp-blob cp-blob-1"></div>
    <div class="cp-blob cp-blob-2"></div>
  </div>

  <nav class="cp-navbar d-flex justify-content-between align-items-center mt-3">
    <a href="/index.html" class="cp-nav-brand">
      <div class="cp-brand-logo"><i class="bi bi-shield-check"></i></div>
      <span>Civic<span class="cp-gradient-text">Pulse</span></span>
    </a>
    <a href="/login.html" class="cp-nav-link">Back to Sign In</a>
  </nav>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="cp-card p-4 p-sm-5 shadow-2 text-center">
          <i class="bi bi-shield-lock-fill text-primary display-4 mb-3"></i>
          <h3 class="fw-bold mb-2">Reset Password</h3>
          <p class="text-muted small mb-4">Enter your registered email address to receive a secure password reset link.</p>

          <div id="forgotAlert" class="alert alert-success d-none py-2 px-3 small text-start"></div>

          <form id="forgotForm">
            <div class="cp-form-group mb-4 text-start">
              <label class="cp-label" for="email">Email Address</label>
              <input type="email" id="email" class="form-control cp-input" placeholder="name@example.com" required>
            </div>

            <button type="submit" id="submitBtn" class="btn cp-btn-primary w-100 py-2 mb-3">
              <span id="btnText">Send Reset Link</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
            </button>
          </form>

          <a href="/login.html" class="small text-muted text-decoration-none">Return to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="cp-footer-slim">
    <div>&copy; 2026 CivicPulse Municipal Redressal developed by Tarun B</div>
  </footer>

  <script type="module">
    import { apiRequest } from '/assets/js/core/api.js';
    import '/assets/js/core/theme.js';

    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('forgotAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Sending...';

      try {
        await apiRequest('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        alertBox.textContent = 'If the email exists in our records, a password reset link has been dispatched. (Check Admin Outbox in Dev mode).';
        alertBox.classList.remove('d-none');
        form.classList.add('d-none');
      } catch (err) {
        alertBox.className = 'alert alert-danger py-2 px-3 small text-start';
        alertBox.textContent = err.message || 'Error processing request';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
