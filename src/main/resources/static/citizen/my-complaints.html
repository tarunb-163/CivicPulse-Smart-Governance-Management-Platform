<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Grievances — CivicPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>
  <div class="cp-aurora-bg">
    <div class="cp-blob cp-blob-1"></div>
    <div class="cp-blob cp-blob-2"></div>
  </div>

  <div class="cp-app-layout">
    <aside class="cp-sidebar" id="cpSidebar">
      <div class="cp-sidebar-header">
        <a href="/citizen/dashboard.html" class="cp-nav-brand">
          <div class="cp-brand-logo"><i class="bi bi-shield-check"></i></div>
          <span class="cp-sidebar-text">Civic<span class="cp-gradient-text">Pulse</span></span>
        </a>
      </div>
      <ul class="cp-sidebar-menu">
        <li class="cp-sidebar-item"><a href="/citizen/dashboard.html" class="cp-sidebar-link"><i class="bi bi-grid-fill"></i><span class="cp-sidebar-text">Dashboard</span></a></li>
        <li class="cp-sidebar-item"><a href="/citizen/new-complaint.html" class="cp-sidebar-link"><i class="bi bi-plus-circle-fill"></i><span class="cp-sidebar-text">File Complaint</span></a></li>
        <li class="cp-sidebar-item"><a href="/citizen/my-complaints.html" class="cp-sidebar-link active"><i class="bi bi-collection-fill"></i><span class="cp-sidebar-text">My Grievances</span></a></li>
        <li class="cp-sidebar-item"><a href="/citizen/profile.html" class="cp-sidebar-link"><i class="bi bi-person-circle"></i><span class="cp-sidebar-text">My Profile</span></a></li>
      </ul>
      <div class="p-3 border-top">
        <button id="logoutBtn" class="cp-btn cp-btn-ghost w-100 justify-content-start text-danger">
          <i class="bi bi-box-arrow-right me-2"></i><span class="cp-sidebar-text">Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="cp-main-content">
      <header class="cp-topbar">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm cp-btn-ghost d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
          <h5 class="fw-bold mb-0">My Reported Grievances</h5>
        </div>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm cp-btn-ghost cp-open-palette" title="Search (Ctrl+K)"><i class="bi bi-search"></i></button>
          <button class="btn btn-sm cp-btn-ghost cp-theme-toggle" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
        </div>
      </header>

      <div class="cp-page-container">
        <!-- Search & Filter Controls -->
        <div class="cp-card p-3 mb-4">
          <div class="row g-2 align-items-center">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search by title or code...">
              </div>
            </div>
            <div class="col-md-6 d-flex gap-2 justify-content-md-end flex-wrap" id="statusFilterChips">
              <button class="btn btn-sm cp-btn-primary rounded-pill filter-btn active" data-status="">All</button>
              <button class="btn btn-sm cp-btn-secondary rounded-pill filter-btn" data-status="SUBMITTED">Submitted</button>
              <button class="btn btn-sm cp-btn-secondary rounded-pill filter-btn" data-status="IN_PROGRESS">In Progress</button>
              <button class="btn btn-sm cp-btn-secondary rounded-pill filter-btn" data-status="RESOLVED">Resolved</button>
              <button class="btn btn-sm cp-btn-secondary rounded-pill filter-btn" data-status="CLOSED">Closed</button>
            </div>
          </div>
        </div>

        <!-- Complaints Cards Grid -->
        <div class="row g-3" id="complaintsGrid">
          <div class="col-12 text-center py-5">
            <span class="spinner-border spinner-border-sm text-primary me-2"></span>Loading grievances...
          </div>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-between align-items-center mt-4">
          <button class="btn btn-sm cp-btn-secondary rounded-pill" id="prevPageBtn" disabled>&larr; Previous</button>
          <span class="small text-muted" id="pageIndicator">Page 1 of 1</span>
          <button class="btn btn-sm cp-btn-secondary rounded-pill" id="nextPageBtn" disabled>Next &rarr;</button>
        </div>
      </div>

      <footer class="cp-footer-slim">
        <div>&copy; 2026 CivicPulse Municipal Redressal developed by Tarun B</div>
      </footer>
    </div>
  </div>

  <script type="module">
    import { checkRouteGuard } from '/assets/js/core/router-guard.js';
    import { logout } from '/assets/js/core/auth.js';
    import { apiRequest } from '/assets/js/core/api.js';
    import { escapeHtml, formatDate, getStatusChip, renderSlaRing, renderPriorityBadge } from '/assets/js/core/utils.js';
    import '/assets/js/core/theme.js';
    import '/assets/js/ui/spotlight.js';
    import '/assets/js/ui/palette.js';
    import '/assets/js/ui/bot.js';

    checkRouteGuard(['CITIZEN', 'OFFICER', 'DEPT_HEAD', 'ADMIN']);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('cpSidebar').classList.toggle('show');
    });

    let currentPage = 0;
    let currentStatus = '';
    let searchQuery = '';

    const grid = document.getElementById('complaintsGrid');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const pageInd = document.getElementById('pageIndicator');

    async function loadComplaints() {
      grid.innerHTML = `<div class="col-12 text-center py-5"><span class="spinner-border spinner-border-sm text-primary me-2"></span>Loading grievances...</div>`;
      try {
        let url = `/complaints/mine?page=${currentPage}&size=9`;
        if (currentStatus) url += `&status=${currentStatus}`;

        const res = await apiRequest(url);
        let items = res.content || [];

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          items = items.filter(c => (c.title || '').toLowerCase().includes(q) || (c.code || '').toLowerCase().includes(q));
        }

        if (items.length === 0) {
          grid.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="bi bi-folder2-open text-muted display-4"></i>
              <p class="text-muted mt-2 mb-3">No matching grievances found.</p>
              <a href="/citizen/new-complaint.html" class="btn cp-btn-primary btn-sm rounded-pill">File New Grievance</a>
            </div>
          `;
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          pageInd.textContent = 'Page 1 of 1';
          return;
        }

        grid.innerHTML = items.map(c => `
          <div class="col-md-6 col-lg-4">
            <div class="cp-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="cp-mono fw-bold text-primary">${escapeHtml(c.code)}</span>
                  ${renderSlaRing(c.slaDueAt, c.status)}
                </div>

                <h6 class="fw-bold mb-2">${escapeHtml(c.title)}</h6>
                <p class="text-muted small mb-3 text-truncate-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                  ${escapeHtml(c.description)}
                </p>

                <div class="d-flex align-items-center gap-2 mb-3">
                  ${getStatusChip(c.status)}
                  <span class="badge bg-secondary-subtle text-secondary">${escapeHtml(c.categoryName || 'General')}</span>
                </div>
              </div>

              <div class="border-top pt-3 d-flex justify-content-between align-items-center">
                <div class="small text-muted"><i class="bi bi-heart-fill text-danger me-1"></i>${c.upvotesCount || 0}</div>
                <a href="/citizen/complaint.html?id=${c.id}" class="btn btn-sm btn-outline-primary rounded-pill">
                  View Detail &rarr;
                </a>
              </div>
            </div>
          </div>
        `).join('');

        const totalPages = res.totalPages || 1;
        pageInd.textContent = `Page ${currentPage + 1} of ${totalPages}`;
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage >= totalPages - 1;

      } catch (err) {
        grid.innerHTML = `<div class="col-12 text-center text-danger py-4">Failed to load grievances</div>`;
      }
    }

    // Filter Buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'btn btn-sm cp-btn-secondary rounded-pill filter-btn';
        });
        btn.className = 'btn btn-sm cp-btn-primary rounded-pill filter-btn active';
        currentStatus = btn.getAttribute('data-status');
        currentPage = 0;
        loadComplaints();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      loadComplaints();
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        loadComplaints();
      }
    });

    nextBtn.addEventListener('click', () => {
      currentPage++;
      loadComplaints();
    });

    loadComplaints();
  </script>
</body>
</html>
