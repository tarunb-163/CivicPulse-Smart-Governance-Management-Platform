<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — CivicPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">
  <div class="cp-aurora-bg">
    <div class="cp-blob cp-blob-1"></div>
    <div class="cp-blob cp-blob-3"></div>
  </div>

  <nav class="cp-navbar d-flex justify-content-between align-items-center mt-3">
    <a href="/index.html" class="cp-nav-brand">
      <div class="cp-brand-logo"><i class="bi bi-shield-check"></i></div>
      <span>Civic<span class="cp-gradient-text">Pulse</span></span>
    </a>
    <a href="/login.html" class="cp-nav-link">Sign In</a>
  </nav>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="cp-card p-4 p-sm-5 shadow-2">
          <h3 class="fw-bold mb-2 text-center">New Password</h3>
          <p class="text-muted small text-center mb-4">Choose a secure password for your account</p>

          <div id="resetAlert" class="alert alert-danger d-none py-2 px-3 small"></div>

          <form id="resetForm">
            <div class="cp-form-group mb-3">
              <label class="cp-label" for="newPassword">New Password</label>
              <input type="password" id="newPassword" class="form-control cp-input" required minlength="8" placeholder="Min. 8 characters">
            </div>

            <div class="cp-form-group mb-4">
              <label class="cp-label" for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control cp-input" required placeholder="Repeat new password">
            </div>

            <button type="submit" id="submitBtn" class="btn cp-btn-primary w-100 py-2">
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="cp-footer-slim">
    <div>&copy; 2026 CivicPulse Municipal Redressal.</div>
  </footer>

  <script type="module">
    import { apiRequest } from '/assets/js/core/api.js';
    import { showToast } from '/assets/js/core/toast.js';
    import '/assets/js/core/theme.js';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('resetAlert');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      alertBox.textContent = 'Invalid or missing password reset token. Please request a new link.';
      alertBox.classList.remove('d-none');
      form.classList.add('d-none');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (newPassword !== confirm) {
        alertBox.textContent = 'Passwords do not match';
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      try {
        await apiRequest('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, newPassword })
        });
        showToast('Password updated! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = '/login.html', 1500);
      } catch (err) {
        alertBox.textContent = err.message || 'Failed to reset password. Link may be expired.';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
