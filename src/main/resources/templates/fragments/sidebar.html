<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     CIVICPULSE SHARED SIDEBAR

     Usage:
     th:replace="~{fragments/sidebar :: sidebar('dashboard')}"

     Available active pages:
     - dashboard
     - complaints
     - notifications
     - profile
     - change-password
     - help
========================================================= -->

<aside
        th:fragment="sidebar(activePage)"
        class="sidebar"
        id="sidebar">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="sidebar-header">

        <div class="brand-logo">

            <i class="bi bi-buildings-fill"></i>

        </div>


        <div class="brand-text">

            <h5>CivicPulse</h5>

            <span>
                Smart Governance
            </span>

        </div>


        <button
                class="sidebar-close d-lg-none"
                id="sidebarClose"
                type="button"
                aria-label="Close sidebar">

            <i class="bi bi-x-lg"></i>

        </button>

    </div>


    <!-- =====================================================
         OFFICER PROFILE
    ====================================================== -->

    <div class="sidebar-profile">

        <div class="profile-avatar">

            <i class="bi bi-person-fill"></i>

        </div>


        <div class="profile-info">

            <h6>
                Officer
            </h6>

            <span>

                <i class="bi bi-circle-fill"></i>

                Active

            </span>

        </div>

    </div>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav class="sidebar-navigation">

        <p class="menu-title">
            MAIN MENU
        </p>


        <ul class="nav flex-column">


            <!-- =================================================
                 DASHBOARD
            ================================================== -->

            <li class="nav-item">

                <a
                        th:href="@{/officer/dashboard}"
                        class="nav-link"
                        th:classappend="${activePage == 'dashboard'} ? ' active' : ''">

                    <i class="bi bi-grid-1x2-fill"></i>

                    <span>
                        Dashboard
                    </span>

                </a>

            </li>


            <!-- =================================================
                 COMPLAINTS
            ================================================== -->

            <li class="nav-item">

                <a
                        th:href="@{/officer/complaints}"
                        class="nav-link"
                        th:classappend="${activePage == 'complaints'} ? ' active' : ''">

                    <i class="bi bi-file-earmark-text-fill"></i>

                    <span>
                        Complaints
                    </span>

                    <span class="nav-badge">
                        0
                    </span>

                </a>

            </li>


            <!-- =================================================
                 NOTIFICATIONS
            ================================================== -->

            <li class="nav-item">

                <a
                        href="#"
                        class="nav-link"
                        th:classappend="${activePage == 'notifications'} ? ' active' : ''">

                    <i class="bi bi-bell-fill"></i>

                    <span>
                        Notifications
                    </span>

                    <span class="nav-badge">
                        0
                    </span>

                </a>

            </li>


            <!-- =================================================
                 ACCOUNT
            ================================================== -->

            <p class="menu-title mt-4">
                ACCOUNT
            </p>


            <!-- =================================================
                 PROFILE
            ================================================== -->

            <li class="nav-item">

                <a
                        th:href="@{/officer/profile}"
                        class="nav-link"
                        th:classappend="${activePage == 'profile'} ? ' active' : ''">

                    <i class="bi bi-person-fill"></i>

                    <span>
                        My Profile
                    </span>

                </a>

            </li>


            <!-- =================================================
                 CHANGE PASSWORD
            ================================================== -->

            <li class="nav-item">

                <a
                        th:href="@{/officer/change-password}"
                        class="nav-link"
                        th:classappend="${activePage == 'change-password'} ? ' active' : ''">

                    <i class="bi bi-shield-lock-fill"></i>

                    <span>
                        Change Password
                    </span>

                </a>

            </li>


            <!-- =================================================
                 HELP & SUPPORT
            ================================================== -->

            <li class="nav-item">

                <a
                        href="#"
                        class="nav-link"
                        th:classappend="${activePage == 'help'} ? ' active' : ''">

                    <i class="bi bi-question-circle-fill"></i>

                    <span>
                        Help &amp; Support
                    </span>

                </a>

            </li>

        </ul>

    </nav>


    <!-- =====================================================
         SIDEBAR LOGOUT

         IMPORTANT:
         Do NOT use href="/officer/logout".
         main.js handles this button and sends the user to
         /logout so Spring Security can process logout.
    ====================================================== -->

    <button
            type="button"
            class="sidebar-logout"
            id="logoutButton">

        <i class="bi bi-box-arrow-right"></i>

        <span>
            Sign Out
        </span>

    </button>


</aside>

</body>

</html>
