<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CivicPulse - My Profile</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        /* =====================================================
           BODY
        ===================================================== */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            background: #123b6d;
            min-height: 56px;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
            font-size: 22px;
            text-decoration: none;
        }

        .navbar-text {
            color: white;
            font-size: 15px;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            min-height: calc(100vh - 56px);
            background: white;
            border-right: 1px solid #ddd;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 13px 20px;
            color: #333;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #eaf2ff;
            color: #123b6d;
        }

        .sidebar a.active {
            background: #eaf2ff;
            color: #123b6d;
            font-weight: 600;
            border-right: 3px solid #123b6d;
        }

        .sidebar i {
            margin-right: 8px;
        }


        /* =====================================================
           LOGOUT BUTTON
        ===================================================== */

        .logout-form {
            margin: 0;
            padding: 0;
        }

        .logout-button {
            width: 100%;
            display: block;

            padding: 13px 20px;

            border: none;
            background: transparent;

            color: #333;

            text-align: left;

            font-family: Arial, sans-serif;
            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;
        }

        .logout-button:hover {
            background: #eaf2ff;
            color: #123b6d;
        }

        .logout-button i {
            margin-right: 8px;
        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .main-content {
            padding: 30px;
        }


        /* =====================================================
           PROFILE CARD
        ===================================================== */

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                    0 3px 12px rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-title {
            color: #123b6d;
            font-weight: bold;
        }


        /* =====================================================
           PROFILE HEADER
        ===================================================== */

        .profile-icon {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #123b6d;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            margin-bottom: 15px;
        }

        .profile-name {
            color: #123b6d;
            font-weight: 600;
            margin-bottom: 4px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            border-radius: 8px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: #123b6d;

            box-shadow:
                    0 0 0 0.2rem rgba(18, 59, 109, 0.15);
        }

        .form-control[readonly] {
            background: #f1f3f5;
            cursor: not-allowed;
        }


        /* =====================================================
           SAVE BUTTON
        ===================================================== */

        .btn-primary {
            background: #123b6d;
            border: none;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background: #0d2d54;
        }


        /* =====================================================
           INFORMATION CARD
        ===================================================== */

        .info-card {
            background: #f8f9fa;

            border: 1px solid #e1e5ea;

            border-radius: 10px;

            padding: 20px;

            margin-top: 25px;
        }

        .info-card h6 {
            color: #123b6d;
            font-weight: bold;
        }

        .info-item {
            margin-bottom: 8px;
        }

        .info-label {
            color: #777;
            font-size: 13px;
        }

        .info-value {
            font-weight: 600;
            color: #333;
        }


        /* =====================================================
           SUCCESS MESSAGE
        ===================================================== */

        .success-message {
            border-radius: 8px;
            margin-bottom: 20px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 768px) {

            .sidebar {
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .main-content {
                padding: 20px;
            }

            .profile-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar">

    <div class="container-fluid">

        <a class="navbar-brand"
           th:href="@{/citizen/dashboard}">

            <i class="bi bi-building"></i>

            CivicPulse

        </a>


        <span class="navbar-text">

            <i class="bi bi-person-circle"></i>

            <span th:text="${citizen.fullName}">
                Citizen
            </span>

        </span>

    </div>

</nav>


<!-- =========================================================
     PAGE CONTAINER
========================================================= -->

<div class="container-fluid">

    <div class="row">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <div class="col-md-2 sidebar">


            <!-- Dashboard -->

            <a th:href="@{/citizen/dashboard}">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>


            <!-- Register Complaint -->

            <a th:href="@{/citizen/complaint-form}">

                <i class="bi bi-plus-circle"></i>

                Register Complaint

            </a>


            <!-- My Complaints -->

            <a th:href="@{/citizen/complaints}">

                <i class="bi bi-file-text"></i>

                My Complaints

            </a>


            <!-- Track Complaint -->

            <a th:href="@{/citizen/track}">

                <i class="bi bi-search"></i>

                Track Complaint

            </a>


            <!-- Notifications -->

            <a th:href="@{/citizen/notifications}">

                <i class="bi bi-bell"></i>

                Notifications

            </a>


            <!-- My Profile -->

            <a th:href="@{/citizen/profile}"
               class="active">

                <i class="bi bi-person"></i>

                My Profile

            </a>


            <!-- =================================================
                 LOGOUT

                 IMPORTANT:
                 DO NOT USE:

                 <a href="/login">

                 Logout must be POST /logout because
                 Spring Security CSRF is enabled.
            ================================================== -->

            <form method="post"
                  th:action="@{/logout}"
                  class="logout-form">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">


                <button
                        type="submit"
                        class="logout-button">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </form>


        </div>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <div class="col-md-10 main-content">


            <div class="profile-card">


                <!-- =================================================
                     PAGE TITLE
                ================================================== -->

                <h2 class="page-title mb-4">

                    <i class="bi bi-person"></i>

                    My Profile

                </h2>


                <!-- =================================================
                     SUCCESS MESSAGE
                ================================================== -->

                <div
                        th:if="${profileSuccess}"
                        class="alert alert-success alert-dismissible fade show success-message"
                        role="alert">

                    <i class="bi bi-check-circle-fill"></i>

                    <span th:text="${profileSuccess}">
                        Profile updated successfully!
                    </span>

                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close">
                    </button>

                </div>


                <!-- =================================================
                     PROFILE HEADER
                ================================================== -->

                <div class="text-center mb-4">


                    <div class="profile-icon mx-auto">

                        <i class="bi bi-person"></i>

                    </div>


                    <h4
                            class="profile-name"
                            th:text="${citizen.fullName}">

                        Citizen User

                    </h4>


                    <p class="text-muted mb-1">

                        Registered Citizen

                    </p>


                    <span
                            class="badge bg-primary"
                            th:text="${citizen.role != null ? citizen.role : 'CITIZEN'}">

                        CITIZEN

                    </span>

                </div>


                <!-- =================================================
                     PROFILE FORM
                ================================================== -->

                <form
                        method="post"
                        th:action="@{/citizen/profile}">


                    <!-- =================================================
                         CSRF TOKEN
                    ================================================== -->

                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">


                    <div class="row">


                        <!-- =================================================
                             FULL NAME
                        ================================================== -->

                        <div class="col-md-6 mb-3">

                            <label
                                    for="fullName"
                                    class="form-label">

                                Full Name

                            </label>


                            <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    class="form-control"
                                    placeholder="Enter full name"
                                    th:value="${citizen.fullName}"
                                    required>

                        </div>


                        <!-- =================================================
                             EMAIL
                        ================================================== -->

                        <div class="col-md-6 mb-3">

                            <label
                                    for="email"
                                    class="form-label">

                                Email

                            </label>


                            <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter email address"
                                    th:value="${citizen.email}"
                                    required>

                        </div>


                        <!-- =================================================
                             PHONE
                        ================================================== -->

                        <div class="col-md-6 mb-3">

                            <label
                                    for="phone"
                                    class="form-label">

                                Phone Number

                            </label>


                            <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    class="form-control"
                                    placeholder="Enter phone number"
                                    th:value="${citizen.phone}"
                                    required>

                        </div>


                        <!-- =================================================
                             CITIZEN ID
                        ================================================== -->

                        <div class="col-md-6 mb-3">

                            <label
                                    for="citizenId"
                                    class="form-label">

                                Citizen ID

                            </label>


                            <input
                                    type="text"
                                    id="citizenId"
                                    class="form-control"
                                    th:value="${citizen.citizenId}"
                                    readonly>

                        </div>


                        <!-- =================================================
                             USERNAME
                        ================================================== -->

                        <div class="col-md-6 mb-3">

                            <label
                                    for="username"
                                    class="form-label">

                                Username

                            </label>


                            <input
                                    type="text"
                                    id="username"
                                    class="form-control"
                                    th:value="${citizen.username}"
                                    readonly>

                        </div>


                        <!-- =================================================
                             ADDRESS
                        ================================================== -->

                        <div class="col-md-12 mb-4">

                            <label
                                    for="address"
                                    class="form-label">

                                Address

                            </label>


                            <textarea
                                    id="address"
                                    name="address"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter your address"
                                    th:text="${citizen.address}"></textarea>

                        </div>


                    </div>


                    <!-- =================================================
                         SAVE BUTTON
                    ================================================== -->

                    <button
                            type="submit"
                            class="btn btn-primary px-4">

                        <i class="bi bi-save"></i>

                        Save Changes

                    </button>


                </form>


                <!-- =================================================
                     ACCOUNT INFORMATION
                ================================================== -->

                <div class="info-card">

                    <h6 class="mb-3">

                        <i class="bi bi-person-badge"></i>

                        Account Information

                    </h6>


                    <div class="row">


                        <!-- Citizen ID -->

                        <div class="col-md-6">

                            <div class="info-item">

                                <div class="info-label">
                                    Citizen ID
                                </div>

                                <div
                                        class="info-value"
                                        th:text="${citizen.citizenId}">
                                    —
                                </div>

                            </div>

                        </div>


                        <!-- Username -->

                        <div class="col-md-6">

                            <div class="info-item">

                                <div class="info-label">
                                    Username
                                </div>

                                <div
                                        class="info-value"
                                        th:text="${citizen.username}">
                                    —
                                </div>

                            </div>

                        </div>


                        <!-- Role -->

                        <div class="col-md-6">

                            <div class="info-item">

                                <div class="info-label">
                                    Account Role
                                </div>

                                <div
                                        class="info-value"
                                        th:text="${citizen.role != null ? citizen.role : 'CITIZEN'}">
                                    CITIZEN
                                </div>

                            </div>

                        </div>


                        <!-- Status -->

                        <div class="col-md-6">

                            <div class="info-item">

                                <div class="info-label">
                                    Account Status
                                </div>

                                <div class="info-value">


                                    <span
                                            th:if="${citizen.active}"
                                            class="text-success">

                                        <i class="bi bi-check-circle-fill"></i>

                                        Active

                                    </span>


                                    <span
                                            th:unless="${citizen.active}"
                                            class="text-danger">

                                        <i class="bi bi-x-circle-fill"></i>

                                        Inactive

                                    </span>


                                </div>

                            </div>

                        </div>


                    </div>

                </div>


            </div>


        </div>

    </div>

</div>


<!-- =========================================================
     BOOTSTRAP JS
========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
