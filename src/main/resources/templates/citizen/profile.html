<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicPulse - My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #123b6d;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
            font-size: 22px;
        }

        .navbar-text {
            color: white;
        }

        .sidebar {
            min-height: calc(100vh - 56px);
            background: white;
            border-right: 1px solid #ddd;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 13px 20px;
            color: #333;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #eaf2ff;
            color: #123b6d;
        }

        .main-content {
            padding: 30px;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .page-title {
            color: #123b6d;
            font-weight: bold;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #123b6d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: #123b6d;
            border: none;
        }

    </style>

</head>


<body>

<nav class="navbar">

    <div class="container-fluid">

        <a class="navbar-brand" href="/citizen/dashboard">

            <i class="bi bi-building"></i>
            CivicPulse

        </a>

        <span class="navbar-text">

            <i class="bi bi-person-circle"></i>
            Citizen

        </span>

    </div>

</nav>


<div class="container-fluid">

    <div class="row">


        <div class="col-md-2 sidebar">

            <a href="/citizen/dashboard">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="/citizen/complaint-form">
                <i class="bi bi-plus-circle"></i>
                Register Complaint
            </a>

            <a href="/citizen/complaints">
                <i class="bi bi-file-text"></i>
                My Complaints
            </a>

            <a href="/citizen/track">
                <i class="bi bi-search"></i>
                Track Complaint
            </a>

            <a href="/citizen/notifications">
                <i class="bi bi-bell"></i>
                Notifications
            </a>

            <a href="/citizen/profile">
                <i class="bi bi-person"></i>
                My Profile
            </a>

            <a href="/login">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>


        <div class="col-md-10 main-content">


            <div class="profile-card">

                <h2 class="page-title mb-4">

                    <i class="bi bi-person"></i>
                    My Profile

                </h2>


                <div class="text-center mb-4">

                    <div class="profile-icon mx-auto">

                        <i class="bi bi-person"></i>

                    </div>

                    <h4>Citizen User</h4>

                    <p class="text-muted">
                        Registered Citizen
                    </p>

                </div>


                <form onsubmit="updateProfile(event)">

                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="Citizen User"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                value="citizen@civicpulse.com"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                value="+91 9876543210"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Citizen ID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="CIT10045"
                                readonly>

                        </div>


                        <div class="col-md-12 mb-4">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                rows="3">Pragati Nagar, Andhra Pradesh</textarea>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary px-4">

                        <i class="bi bi-save"></i>
                        Save Changes

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<script>

function updateProfile(event) {

    event.preventDefault();

    alert("Profile updated successfully!");

}

</script>


</body>

</html>
