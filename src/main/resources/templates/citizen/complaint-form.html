<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicPulse - Register Complaint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #123b6d;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
            font-size: 22px;
        }

        .navbar-text {
            color: white;
        }

        .sidebar {
            min-height: calc(100vh - 56px);
            background: white;
            border-right: 1px solid #ddd;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 13px 20px;
            color: #333;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #eaf2ff;
            color: #123b6d;
        }

        .main-content {
            padding: 30px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .form-title {
            color: #123b6d;
            font-weight: bold;
        }

        .btn-primary {
            background: #123b6d;
            border: none;
        }

        .btn-primary:hover {
            background: #0d2c52;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="container-fluid">

        <a class="navbar-brand" href="/citizen/dashboard">
            <i class="bi bi-building"></i>
            CivicPulse
        </a>

        <span class="navbar-text">
            <i class="bi bi-person-circle"></i>
            Citizen
        </span>

    </div>
</nav>


<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">

            <a href="/citizen/dashboard">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="/citizen/complaint-form">
                <i class="bi bi-plus-circle"></i>
                Register Complaint
            </a>

            <a href="/citizen/complaints">
                <i class="bi bi-file-text"></i>
                My Complaints
            </a>

            <a href="/citizen/track">
                <i class="bi bi-search"></i>
                Track Complaint
            </a>

            <a href="/citizen/notifications">
                <i class="bi bi-bell"></i>
                Notifications
            </a>

            <a href="/citizen/profile">
                <i class="bi bi-person"></i>
                My Profile
            </a>

            <a href="/login">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>


        <!-- MAIN CONTENT -->
        <div class="col-md-10 main-content">

            <div class="form-card">

                <h2 class="form-title mb-2">
                    <i class="bi bi-plus-circle"></i>
                    Register a Complaint
                </h2>

                <p class="text-muted mb-4">
                    Report a civic issue to the concerned authorities.
                </p>


                <form onsubmit="submitComplaint(event)">

                    <div class="row">

                        <!-- CATEGORY -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Complaint Category
                            </label>

                            <select class="form-select" required>

                                <option value="">
                                    Select Category
                                </option>

                                <option>Road Damage</option>
                                <option>Water Supply</option>
                                <option>Street Light</option>
                                <option>Waste Management</option>
                                <option>Sanitation</option>
                                <option>Electricity</option>
                                <option>Other</option>

                            </select>

                        </div>


                        <!-- SUBJECT -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Complaint Subject
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter complaint subject"
                                required>

                        </div>

                    </div>


                    <!-- DESCRIPTION -->
                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            rows="5"
                            placeholder="Describe the issue in detail"
                            required></textarea>

                    </div>


                    <!-- LOCATION -->
                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter location of the issue"
                            required>

                    </div>


                    <!-- IMAGE -->
                    <div class="mb-4">

                        <label class="form-label">
                            Upload Image <span class="text-muted">(Optional)</span>
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            accept="image/*">

                        <small class="text-muted">
                            Upload an image related to the complaint.
                        </small>

                    </div>


                    <!-- BUTTONS -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary px-4">

                            <i class="bi bi-send"></i>
                            Submit Complaint

                        </button>

                        <a
                            href="/citizen/dashboard"
                            class="btn btn-outline-secondary">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<script>

function submitComplaint(event) {

    event.preventDefault();

    alert(
        "Complaint submitted successfully!\\n\\nComplaint ID: CMP202600124"
    );

    window.location.href = "/citizen/complaints";

}

</script>

</body>
</html>
